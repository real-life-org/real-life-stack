# release-please fuer Real Life Stack: verwaltet die publizierbaren Pakete
# (data-interface, toolkit, vier Konnektoren) UND die Reference App in EINER
# Release-PR. Merge der PR erzeugt die Tags → npm-Publish (publish.yml) bzw.
# App-Build (build-on-tag) und Instanz-Image (publish-app-image).
# Siehe docs/RELEASING.md.
#
# WER DIE NACHGELAGERTEN WORKFLOWS STARTET, HAENGT AM TOKEN.
#
# Mit RELEASE_PLEASE_TOKEN traegt alles, was release-please anlegt, einen
# echten Benutzer-Token: Commit, Tag und Release. GitHub startet daraufhin die
# normalen Trigger wieder — `release: published` fuer publish.yml und der
# Tag-Push fuer build-on-tag. Ohne das Secret faellt der Job auf GITHUB_TOKEN
# zurueck, und aus dessen Ereignissen startet GitHub keine Workflows; erst dann
# braucht es die Dispatch-Kette weiter unten.
#
# Fuer diese beiden gilt: genau EINER der Wege darf laufen. Liefen beide, baute
# jeder Workflow zweimal. npm wies den zweiten Publish-Lauf mit `E409 — Cannot
# publish over previously staged version` ab, und zwei parallele Android-Builds
# luden dasselbe Asset an dasselbe Release — ein Rennen um genau das Artefakt,
# an das sich die Signier-Pipeline bindet. Das war vom 10.09.2026 (Einfuehrung
# des Tokens) bis zum 15.09. der Zustand. Sie haengen darum am Ausgabewert
# `own_token`.
#
# DIE AUSNAHME: publish-app-image.yml hoert auf `push: branches: [master]`,
# nicht auf Tags. Der Release-Commit erzeugt dort nur `edge`; das versionierte
# Image, auf das die Instanzen pinnen, entsteht EINZIG ueber den Dispatch. Der
# laeuft darum immer. Details am Schritt selbst.
#
# Die frueher hier notierte Sorge, der Dispatch sei fuer npms Trusted
# Publishing noetig, traegt nicht: auch bei `release: published` ist publish.yml
# der Top-Level-Workflow, und genau darauf bindet npm. Nachgewiesen am
# 15.09.2026, Lauf 35011958238: veroeffentlicht samt Provenance-Eintrag.
name: Release Please

on:
  push:
    branches: [master]

# `issues: write` gehoert dazu, auch wenn dieser Workflow keine Issues
# anlegt: release-please verwaltet Labels auf der Release-PR
# (`autorelease: pending` → `tagged`), und Labels haengen in der GitHub-API am
# Issues-Bereich. Ohne das Recht scheitert die Label-Verwaltung — die
# Action nennt alle drei in ihrer eigenen Doku. Gilt fuer das GITHUB_TOKEN
# (also den Fallback unten); der eigene Token braucht dasselbe Recht als
# "Issues: read+write".
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # Pakete: pro Komponente released-Flag + Tag-Name (Klammer-Notation, weil
      # der Key Schraegstriche enthaelt).
      data_interface_released: ${{ steps.release.outputs['packages/data-interface--release_created'] }}
      data_interface_tag: ${{ steps.release.outputs['packages/data-interface--tag_name'] }}
      toolkit_released: ${{ steps.release.outputs['packages/toolkit--release_created'] }}
      toolkit_tag: ${{ steps.release.outputs['packages/toolkit--tag_name'] }}
      mock_connector_released: ${{ steps.release.outputs['packages/mock-connector--release_created'] }}
      mock_connector_tag: ${{ steps.release.outputs['packages/mock-connector--tag_name'] }}
      local_connector_released: ${{ steps.release.outputs['packages/local-connector--release_created'] }}
      local_connector_tag: ${{ steps.release.outputs['packages/local-connector--tag_name'] }}
      wot_connector_released: ${{ steps.release.outputs['packages/wot-connector--release_created'] }}
      wot_connector_tag: ${{ steps.release.outputs['packages/wot-connector--tag_name'] }}
      supabase_connector_released: ${{ steps.release.outputs['packages/supabase-connector--release_created'] }}
      supabase_connector_tag: ${{ steps.release.outputs['packages/supabase-connector--tag_name'] }}
      # App (component "app") → Tag app-vX.Y.Z, loest build-on-tag per Dispatch aus.
      app_released: ${{ steps.release.outputs['apps/reference--release_created'] }}
      app_tag: ${{ steps.release.outputs['apps/reference--tag_name'] }}
      # "true", wenn release-please mit einem echten Benutzer-Token gelaufen
      # ist. Dann starten die nachgelagerten Workflows von selbst und die
      # Dispatch-Kette unten muss schweigen (siehe Kopf der Datei).
      own_token: ${{ steps.token.outputs.own }}
    steps:
      # Der `secrets`-Kontext steht in einem Job-`if` NICHT zur Verfuegung —
      # dort gibt es nur github, needs, vars und inputs. Die Frage wird darum
      # hier beantwortet und als Ausgabewert weitergereicht. Verglichen wird
      # nur auf "gesetzt oder nicht"; der Wert selbst taucht nirgends auf.
      - id: token
        run: echo "own=${{ secrets.RELEASE_PLEASE_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Eigener Token statt GITHUB_TOKEN — sonst bleibt die Release-PR ohne
          # Checks liegen: GitHub startet fuer Ereignisse, die mit dem
          # GITHUB_TOKEN ausgeloest werden, keine Workflows. Die Tests landen
          # dann auf "wartet auf Freigabe", und `pr-title` entsteht gar nicht
          # erst — als Pflicht-Check des Rulesets blockiert der fehlende Status
          # den Merge dauerhaft ("Expected — Waiting for status to be
          # reported"). Der Handgriff dagegen war, den PR-Titel einmal zu
          # aendern und zurueckzusetzen.
          #
          # Der Fallback haelt den Workflow lauffaehig, solange das Secret
          # fehlt: dann gilt wieder das alte Verhalten samt Handgriff, statt
          # dass release-please gar nicht mehr laeuft.
          #
          # Noetige Rechte (fein granuliert, nur dieses Repo):
          # Contents: read+write · Issues: read+write · Pull requests: read+write
          # Issues, weil release-please Labels auf der Release-PR fuehrt.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  # ERSATZWEG, nur ohne RELEASE_PLEASE_TOKEN: pro released Paket publish.yml per
  # workflow_dispatch anstossen, weil GITHUB_TOKEN-Releases kein `on: release`
  # ausloesen. Mit Token laeuft publish.yml von selbst und dieser Job wird
  # uebersprungen — sonst publizieren beide Wege dieselbe Version und der
  # zweite scheitert an npm (E409). Guard pro Paket: released=true aber leerer
  # Tag = Abbruch (Schema-Drift).
  trigger-publish:
    needs: release-please
    if: >-
      needs.release-please.outputs.releases_created == 'true'
      && needs.release-please.outputs.own_token != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Publish je erzeugtem Paket-Release anstossen
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_INTERFACE_RELEASED: ${{ needs.release-please.outputs.data_interface_released }}
          DATA_INTERFACE_TAG: ${{ needs.release-please.outputs.data_interface_tag }}
          TOOLKIT_RELEASED: ${{ needs.release-please.outputs.toolkit_released }}
          TOOLKIT_TAG: ${{ needs.release-please.outputs.toolkit_tag }}
          MOCK_RELEASED: ${{ needs.release-please.outputs.mock_connector_released }}
          MOCK_TAG: ${{ needs.release-please.outputs.mock_connector_tag }}
          LOCAL_RELEASED: ${{ needs.release-please.outputs.local_connector_released }}
          LOCAL_TAG: ${{ needs.release-please.outputs.local_connector_tag }}
          WOT_RELEASED: ${{ needs.release-please.outputs.wot_connector_released }}
          WOT_TAG: ${{ needs.release-please.outputs.wot_connector_tag }}
          SUPABASE_RELEASED: ${{ needs.release-please.outputs.supabase_connector_released }}
          SUPABASE_TAG: ${{ needs.release-please.outputs.supabase_connector_tag }}
        run: |
          set -euo pipefail
          started=0
          missing=0

          dispatch() {
            released=$1; tag=$2; label=$3
            # released ist das AUTORITATIVE Signal — nur bei true dispatchen. Ein
            # nichtleerer Tag allein reicht nicht (release-please liefert Tag-Namen
            # teils auch ohne neues Release).
            # WICHTIG: `return 0`, nicht nacktes `return`. Ein blosses `return`
            # liefert den Status des letzten Kommandos — hier des fehlgeschlagenen
            # Tests — also 1. Unter `set -e` bricht damit der ganze Job ab. Genau
            # das hat den ersten App-only-Release rot gemacht.
            [ "$released" = "true" ] || return 0
            if [ -z "$tag" ]; then
              echo "ABBRUCH-Kandidat: $label als released gemeldet, aber kein Tag-Output." >&2
              missing=1
              return
            fi
            echo "starte publish.yml für $tag"
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" -f tag="$tag"
            started=$((started + 1))
          }

          dispatch "$DATA_INTERFACE_RELEASED" "$DATA_INTERFACE_TAG" "data-interface"
          dispatch "$TOOLKIT_RELEASED"        "$TOOLKIT_TAG"        "toolkit"
          dispatch "$MOCK_RELEASED"           "$MOCK_TAG"           "mock-connector"
          dispatch "$LOCAL_RELEASED"          "$LOCAL_TAG"          "local-connector"
          dispatch "$WOT_RELEASED"            "$WOT_TAG"            "wot-connector"
          dispatch "$SUPABASE_RELEASED"       "$SUPABASE_TAG"       "supabase-connector"

          if [ "$missing" -eq 1 ]; then
            echo "ABBRUCH: mindestens ein released-Paket ohne Tag-Output (Schema-Aenderung?)." >&2
            exit 1
          fi
          # releases_created war true — aber es kann ein reines App-Release ohne
          # Paket gewesen sein. Dann ist started=0 voellig ok (kein Abbruch).
          echo "$started Publish-Lauf/Laeufe angestossen"

  # ERSATZWEG, nur ohne RELEASE_PLEASE_TOKEN: wurde die App released (Tag
  # app-vX.Y.Z), den nativen Build und das Instanz-Image anstossen. Mit Token
  # erledigen das der Tag-Push (build-on-tag) und der Commit-Push
  # (publish-app-image) selbst; dieser Job wird dann uebersprungen. Liefen
  # beide, bauten zwei Laeufe denselben Android-Build und luden dasselbe Asset
  # an dasselbe Release — ein Rennen um genau das Artefakt, an das sich die
  # Signier-Pipeline ueber build-info.commit bindet.
  #
  # build-on-tag checkt inputs.tag aus, also traegt build-info.commit den
  # Tag-Commit — genau worauf die Signier-Pipeline (verify_attested_artifact)
  # bindet. Ueber den Tag-Push gilt dasselbe, dort IST der Tag der Ref.
  # Signiert/deployt wird danach auf dem Server:
  # docker compose run --rm signer|play-publish.
  trigger-app-build:
    needs: release-please
    if: needs.release-please.outputs.app_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # ERSATZWEG, nur ohne RELEASE_PLEASE_TOKEN. build-on-tag hoert selbst auf
      # `push: tags: app-v*` und behandelt beide Wege gleichwertig: es checkt
      # `inputs.tag` ODER `github.ref` aus, build-info.commit traegt also so
      # oder so den Tag-Commit. Mit Token waere dieser Anstoss der zweite —
      # zwei Laeufe bauten denselben Android-Build und luden dasselbe Asset an
      # dasselbe Release.
      - name: build-on-tag anstossen (nur ohne eigenen Token)
        if: needs.release-please.outputs.own_token != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TAG: ${{ needs.release-please.outputs.app_tag }}
        run: |
          set -euo pipefail
          if [ -z "$APP_TAG" ]; then
            echo "ABBRUCH: app_released=true, aber kein app_tag-Output (Schema-Aenderung?)." >&2
            exit 1
          fi
          echo "starte build-on-tag fuer $APP_TAG"
          gh workflow run build-on-tag.yml --repo "$GITHUB_REPOSITORY" -f tag="$APP_TAG"

      # IMMER — und das ist der Unterschied zu allem anderen hier.
      #
      # publish-app-image.yml hoert auf `push: branches: [master]`, NICHT auf
      # Tags. Der Push des Release-Commits erzeugt darum nur `edge`. Das
      # versionierte Image (`0.3.1` und `0.3`), auf das die Instanzen pinnen,
      # entsteht einzig ueber diesen Dispatch mit `-f tag=app-vX.Y.Z`.
      #
      # Wer diesen Schritt an den Token knuepft wie die anderen, dreht dem
      # Server die Bilder ab: die .env zeigt auf eine Version, die nie gebaut
      # wurde. Erst wenn publish-app-image einen eigenen Tag-Trigger bekommt,
      # darf hier eine Bedingung stehen.
      - name: publish-app-image fuer den App-Tag anstossen
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TAG: ${{ needs.release-please.outputs.app_tag }}
        run: |
          set -euo pipefail
          if [ -z "$APP_TAG" ]; then
            echo "ABBRUCH: app_released=true, aber kein app_tag-Output (Schema-Aenderung?)." >&2
            exit 1
          fi
          echo "starte publish-app-image fuer $APP_TAG"
          gh workflow run publish-app-image.yml --repo "$GITHUB_REPOSITORY" -f tag="$APP_TAG"
