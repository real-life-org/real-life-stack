# Duenne Huelle um scripts/release/build-android.sh — die gesamte Logik lebt
# dort ("Plattform ist Trigger, nicht Gehirn"). Ein Umzug zu Forgejo/GitLab
# ersetzt nur diese Datei. Schwester-Workflow: web-of-trust (Tag-Muster v*).
#
# Das Artefakt ist ein UNSIGNIERTES APK und wird bewusst NICHT ans
# GitHub-Release gehaengt: dort liegt ausschliesslich das mit dem
# F-Droid-Schluessel signierte APK.
name: Build on Tag

on:
  push:
    tags: ['app-v[0-9]*']      # nur App-Tags; ota-* nicht
  workflow_dispatch:
    inputs:
      tag:
        description: 'App-Tag, der gebaut werden soll (z.B. app-v0.2.1)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: false`: danach laufen `pnpm install` (Lifecycle-
      # Skripte von Dependencies) und das Release-Skript. Der Job pusht nichts
      # per Git — `build-android.sh` nutzt git nur lesend (`git tag
      # --points-at`) —, der Token muss also nicht in der Git-Konfiguration
      # liegen bleiben.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      # KEIN version:-Input — packageManager in der package.json entscheidet.
      # v4 bricht sonst mit "Multiple versions of pnpm specified" ab.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # inputs.tag NIE direkt in run: interpolieren — das waere Script-Injection.
      # Ueber env ist der Wert ein inertes Datum, das Skript quotet ihn.
      - name: Build
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: scripts/release/build-android.sh "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: out/release/
          retention-days: 30
          if-no-files-found: error

      # Signierdienst anstossen (v2). Bis hierher ist das unsignierte Artefakt
      # hochgeladen; schlaegt ein Schritt davor fehl, laeuft dieser nie.
      #
      # Der Lauf ist zu diesem Zeitpunkt aber noch NICHT abgeschlossen — ein
      # hochgeladenes Artefakt ist kein gruener Workflow. Deshalb geht die
      # `run_id` mit ins Payload: der Signierjob wartet drueben auf den
      # Abschluss dieses Laufs, bevor er signiert (real-life-stack#338). Die
      # Alternative, den Dispatch in einen Folge-Job zu schieben, haette
      # dasselbe Problem eine Ebene hoeher (auch der Folge-Job laeuft noch).
      #
      # WARUM ein Event und kein Runner hier: der Server haelt den nicht
      # rotierbaren F-Droid-Schluessel. Ein self-hosted Runner an DIESEM
      # oeffentlichen Repo waere ueber Fork-PRs angreifbar. Also schickt dieses
      # Repo nur ein Datenpaket an das PRIVATE `wot-release`, das selbst
      # entscheidet, was damit passiert (siehe dessen README, "Runner-
      # Installation").
      - name: Signierdienst anstossen
        env:
          # NIE nach `run:` interpolieren — `${{ }}` wird vor der Shell ersetzt.
          # Ueber env ist der Tag ein inertes Datum.
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          # Der Lauf, der gerade dispatcht. Er ist JETZT noch `in_progress` —
          # das Artefakt liegt oben, der Workflow ist aber nicht abgeschlossen.
          # Der Signierjob drueben wartet damit auf genau diesen Lauf, statt
          # sofort einen gruenen Lauf zu verlangen und abzubrechen
          # (real-life-stack#338). Ohne run_id faellt er auf den langsameren
          # Handstart-Pfad zurueck.
          RUN_ID: ${{ github.run_id }}
          # Fine-grained PAT, Owner real-life-org, nur Repo wot-release,
          # Contents: read and write (repository_dispatch verlangt
          # contents:write). Bewusst NICHT der GITHUB_TOKEN: der gilt nur fuer
          # dieses Repo.
          GH_TOKEN: ${{ secrets.WOT_RELEASE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::Secret WOT_RELEASE_DISPATCH_TOKEN fehlt — Signierdienst nicht angestossen."
            echo "Der Handgriff bleibt der Weg:  docker compose run --rm signer rls $TAG  (auf dem Server)"
            exit 0
          fi
          # Bash-`[[ =~ ]]` statt `grep -E`: grep prueft ZEILENWEISE, ein Tag
          # mit Zeilenumbruch kaeme sonst durch (wot-release#5). `$` ist hier
          # Stringende, nicht Zeilenende.
          if [[ ! "$TAG" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Tag ist kein app-vX.Y.Z — kein Dispatch."
            exit 0
          fi
          # Ein Fehler HIER faellt auf (roter Job), kostet aber nichts: das
          # Artefakt liegt schon oben, und der Handstart im wot-release
          # (`gh workflow run sign-on-dispatch.yml -f app=rls -f tag=…`)
          # holt das Signieren jederzeit nach.
          gh api -X POST repos/real-life-org/wot-release/dispatches \
            -f event_type=app-release \
            -f 'client_payload[app]=rls' \
            -f "client_payload[tag]=$TAG" \
            -f "client_payload[run_id]=$RUN_ID"
          echo "Dispatch app-release gesendet: rls $TAG (Lauf $RUN_ID)"
